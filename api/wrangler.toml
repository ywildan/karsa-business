# Cloudflare Worker untuk Karsa Business versi 2.
#
# Berkas ini TIDAK berisi kredensial apa pun. Yang perlu masuk ke akunmu ada
# dua, dan keduanya sengaja tidak di-commit:
#
#   account_id     -> dari `wrangler accounts list`, dipakai `--account-id` atau
#                     environment CLOUDFLARE_ACCOUNT_ID di CI.
#   DATABASE_URL   -> string koneksi Neon, lewat `wrangler secret put DATABASE_URL`.
#                     Kalau ia ditulis di sini, ia ikut terbaca siapa pun yang
#                     punya akses baca ke repo — termasuk sebagai riwayat commit
#                     setelah ia dihapus lagi.
#
# Deploy (komitmen C5, butuh akun Cloudflare + Neon punyamu). `wrangler` sengaja
# tidak masuk devDependencies: ia cuma diperlukan sekali, dan menyimpannya di
# daftar dependensi membuat loop validate memasang paket besar tiap push.
# Versinya ditulis di tempat ia dipakai:
#   cd api && npx --yes wrangler@4.142.0 deploy
#   printf '%s' "$NEON_URL" | npx --yes wrangler@4.142.0 secret put DATABASE_URL

name = "karsa-business-api"
main = "src/index.ts"

# Tanggal kompatibilitas adalah bagian dari kontrak runtime, bukan metadata:
# ia menentukan perilaku Worker yang diuji saat deploy, jadi ia tidak boleh
# ikut naik sendiri setiap kali wrangler diperbarui.
compatibility_date = "2026-09-01"

# Pustaka driver `pg` mengintip `globalThis.process`. Tanpa flag ini ia tetap
# jalan (pengintipannya dijaga), tapi menyalakannya membuat perilaku di Worker
# sama dengan perilaku waktu kami mencoba memanggil Neon dari Node.
compatibility_flags = ["node_compat"]

# Subdomain `*.workers.dev` adalah alamat gratis yang dipakai saat C5. Ganti ke
# rute kustom kalau nama domain sendiri sudah dibeli.
workers_dev = true

[vars]
# Daftar asal peramban yang boleh memanggil, dipisah koma; kosong = CORS mati.
# Diisi apa adanya setelah dashboard punya alamat tetap, misalnya
#   ALLOWED_ORIGINS = "https://karsa-business.vercel.app"
# Kosong adalah pilihan bawaan yang sengaja: lebih baik dashboard gagal memuat
# daripada API kita terbuka untuk siapa pun yang membuka Console peramban.
ALLOWED_ORIGINS = ""

[triggers]
# Perapian tombstone, 03:00 UTC. Lihat `scheduled()` di src/index.ts: batas
# umurnya TOMBSTONE_RETENTION_DAYS, dan penghapusan + kenaikan floor berjalan
# dalam satu transaksi.
crons = ["0 3 * * *"]
