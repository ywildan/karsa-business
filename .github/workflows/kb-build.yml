name: Build APK

# Loop lebar: hanya jalan di main, dan hanya ketika sumber aplikasi atau
# workflow ini yang berubah. Yang dibuktikan di sini bukan logika pembukuan
# (itu urusan Validate), melainkan seluruh jalur Android — flutter create,
# overlay, Gradle, signing, sampai berkas APK bisa dipasang.

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - ".github/workflows/kb-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kb-build-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.0"
  BUILD_DIR: kb-build

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.signing.outputs.configured }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # JDK dipasang eksplisit: label ubuntu-latest akan berpindah image pada
      # Oktober 2026, dan versi Java tidak boleh ikut berpindah tanpa diminta.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate isolated Flutter project
        run: >-
          flutter create
          --org com.ywildan
          --project-name karsabusiness
          "$BUILD_DIR"

      - name: Overlay product source
        run: |
          set -euo pipefail
          cp app/pubspec.yaml "$BUILD_DIR/pubspec.yaml"
          cp app/analysis_options.yaml "$BUILD_DIR/analysis_options.yaml"
          rm -f "$BUILD_DIR/test/widget_test.dart"
          cp -R app/lib/. "$BUILD_DIR/lib/"
          cp -R app/test/. "$BUILD_DIR/test/"
          cp app/android/AndroidManifest.xml \
            "$BUILD_DIR/android/app/src/main/AndroidManifest.xml"
          if [ -d app/assets ]; then
            mkdir -p "$BUILD_DIR/assets"
            cp -R app/assets/. "$BUILD_DIR/assets/"
          fi

      # sqflite minta API 23 ke atas. Dialek Gradle-nya ikut dua-duanya karena
      # flutter create pernah berganti dari Groovy ke .kts di tengah jalan.
      # Kalau suatu hari polanya berubah lagi, langkah ini harus berhenti di
      # sini, bukan diam-diam menghasilkan APK dengan minSdk warisan template.
      - name: Set Android minimum SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$BUILD_DIR/android/app/build.gradle.kts" ]; then
            gradle="$BUILD_DIR/android/app/build.gradle.kts"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$gradle"
            grep -q "minSdk = 23" "$gradle"
          else
            gradle="$BUILD_DIR/android/app/build.gradle"
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$gradle"
            grep -q "minSdkVersion 23" "$gradle"
          fi
          echo "minSdk dibaca dari $gradle:"
          grep -n "minSdk" "$gradle" | sed 's/^/  /'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: kb-gradle-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/pubspec.yaml') }}
          restore-keys: |
            kb-gradle-${{ env.FLUTTER_VERSION }}-
            kb-gradle-

      - name: Resolve dependencies in CI
        working-directory: ${{ env.BUILD_DIR }}
        run: flutter pub get

      - name: Run tests
        working-directory: ${{ env.BUILD_DIR }}
        run: flutter test

      # Kalau empat secret belum ada, langkah ini TIDAK menggagalkan build:
      # template Flutter sudah men-sign release dengan kunci debug, jadi yang
      # dihasilkan tetap APK release yang bisa dipasang. Seluruh jalur Gradle
      # tetap terbukti dilalui; yang belum hanya kunci tanda tangannya.
      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || \
                -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Keystore belum dipasang. APK ini ber-signing debug: pasangannya tidak bisa ditimpa oleh build release-signed nanti, jadi uninstall lebih dulu."
            exit 0
          fi

          key_file="$RUNNER_TEMP/kb-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          echo "KB_KEYSTORE_FILE=$key_file" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

          python3 - <<'PY'
          import os
          from pathlib import Path

          app = Path(os.environ["BUILD_DIR"], "android", "app")
          gradle_file = next(
              (p for p in (app / "build.gradle.kts", app / "build.gradle") if p.is_file()),
              None,
          )
          if gradle_file is None:
              raise SystemExit("Berkas Gradle aplikasi Android tidak ditemukan")

          source = gradle_file.read_text()
          if gradle_file.suffix == ".kts":
              block = '''    signingConfigs {
              create("release") {
                  storeFile = file(System.getenv("KB_KEYSTORE_FILE"))
                  storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
              }
          }
          '''
              needle = 'signingConfig = signingConfigs.getByName("debug")'
              if needle not in source:
                  raise SystemExit("Templat signing Gradle .kts tidak seperti yang diharapkan")
              source = source.replace("android {", "android {\n" + block, 1)
              source = source.replace(
                  needle,
                  'signingConfig = signingConfigs.getByName("release")',
                  1,
              )
          else:
              block = '''    signingConfigs {
                  release {
                      storeFile file(System.getenv('KB_KEYSTORE_FILE'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
              '''
              if "android {" not in source:
                  raise SystemExit("Blok android Gradle Groovy tidak seperti yang diharapkan")
              source = source.replace("android {", "android {\n" + block, 1)
              needle = "signingConfig signingConfigs.debug"
              if needle not in source:
                  raise SystemExit("Templat signing Gradle Groovy tidak seperti yang diharapkan")
              source = source.replace(needle, "signingConfig signingConfigs.release", 1)

          gradle_file.write_text(source)
          print(f"Signing release dipasang di {gradle_file}")
          PY

      # pipefail wajib di sini: tanpanya `flutter build | tee` mengembalikan
      # status tee, jadi build yang gagal terlihat sukses dan langkah berikutnya
      # mencari APK yang tidak pernah ada.
      - name: Build release APK
        working-directory: ${{ env.BUILD_DIR }}
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          set -euo pipefail

          flutter build apk --release
          --build-number=${{ github.run_number }}
          2>&1 | tee flutter-build.log

      # Tanpa Android SDK di mesin pengembang, satu-satunya cara membaca
      # kegagalan Gradle adalah log yang dikirim balik.
      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$BUILD_DIR/flutter-build.log" <<'PY'
          import sys
          from pathlib import Path

          log = Path(sys.argv[1])
          tail = "\n".join(log.read_text(errors="replace").splitlines()[-120:]) \
              if log.exists() else "flutter build apk selesai tanpa log yang tersimpan."
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Build APK gagal::{escaped}")
          PY

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kb-build-log
          path: ${{ env.BUILD_DIR }}/flutter-build.log
          if-no-files-found: ignore

      - name: Record APK checksum
        working-directory: ${{ env.BUILD_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$apk"
          sha256sum "$apk" | tee "$RUNNER_TEMP/kb-apk-sha256.txt"
          du -h "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karsa-business-apk-${{ github.sha }}
          path: ${{ env.BUILD_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: karsa-business-apk-sha256-${{ github.sha }}
          path: ${{ runner.temp }}/kb-apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove runner keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/kb-release.jks"

  release:
    name: Publish GitHub Release
    needs: apk
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.apk.result == 'success' &&
      needs.apk.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "version tidak ada di app/pubspec.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=kb-v${version}" >> "$GITHUB_OUTPUT"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: karsa-business-apk-${{ github.sha }}
          path: release-assets

      - name: Download checksum
        uses: actions/download-artifact@v4
        with:
          name: karsa-business-apk-sha256-${{ github.sha }}
          path: release-checksum

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find release-assets -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "APK tidak ada di artifact yang diunduh" >&2
            exit 1
          fi
          checksum="$(cut -d' ' -f1 "$(find release-checksum -type f -print -quit)")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG sudah ada; tidak ada yang dibuat ulang."
            exit 0
          fi
          gh release create "$TAG" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Karsa Business $VERSION" \
            --notes "APK release-signed universal (arm64 + armeabi-v7a + x86_64).
          Pasang langsung dari berkas ini; tidak lewat Play Store.

          sha256: \`$checksum\`"
