name: Debug Build APK

# Jaring pengaman. Tidak ada Flutter, tidak ada Android SDK, dan tidak ada adb
# di mesin pengembang, jadi satu-satunya cara melihat apa yang sebenarnya
# dikatakan Gradle adalah membangun ulang dengan `-v` dan mengirim log utuhnya
# balik. Jalan ini dipanggil dari tombol, tidak pernah otomatis, karena tiap
# kali ia jalan ia memakai menit runner yang sama dengan build sungguhan.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch atau commit yang dibangun
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: kb-debug-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.0"
  BUILD_DIR: kb-build

jobs:
  debug:
    name: Verbose build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # `ref` hanya masuk ke input actions/checkout, tidak pernah ke shell.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Persis langkah yang sama dengan kb-build.yml: kalau yang satu gagal,
      # hasilnya harus bisa dibandingkan apel dengan apel.
      - name: Generate isolated Flutter project
        run: >-
          flutter create
          --org com.ywildan
          --project-name karsabusiness
          "$BUILD_DIR"

      - name: Overlay product source
        run: |
          set -euo pipefail
          cp app/pubspec.yaml "$BUILD_DIR/pubspec.yaml"
          cp app/analysis_options.yaml "$BUILD_DIR/analysis_options.yaml"
          rm -f "$BUILD_DIR/test/widget_test.dart"
          cp -R app/lib/. "$BUILD_DIR/lib/"
          cp -R app/test/. "$BUILD_DIR/test/"
          cp app/android/AndroidManifest.xml \
            "$BUILD_DIR/android/app/src/main/AndroidManifest.xml"
          if [ -d app/assets ]; then
            mkdir -p "$BUILD_DIR/assets"
            cp -R app/assets/. "$BUILD_DIR/assets/"
          fi

      # Sama seperti build sungguhan: tanpa ini kegagalan di sini bisa punya
      # sebab yang berbeda dari kegagalan yang sedang kita cari.
      - name: Set Android minimum SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$BUILD_DIR/android/app/build.gradle.kts" ]; then
            gradle="$BUILD_DIR/android/app/build.gradle.kts"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$gradle"
            grep -q "minSdk = 23" "$gradle"
          else
            gradle="$BUILD_DIR/android/app/build.gradle"
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$gradle"
            grep -q "minSdkVersion 23" "$gradle"
          fi

      - name: Resolve dependencies in CI
        working-directory: ${{ env.BUILD_DIR }}
        run: flutter pub get

      - name: Build with every word Gradle has
        working-directory: ${{ env.BUILD_DIR }}
        shell: bash
        run: >-
          set -euo pipefail

          flutter build apk --release -v 2>&1 | tee kb-debug-build.log

      # pipefail membuat kegagalan tetap kegagalan, sementara log utuhnya tetap
      # tertulis: langkah di bawah membacanya meski build-nya merah.
      - name: Report the tail
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$BUILD_DIR/kb-debug-build.log" <<'PY'
          import sys
          from pathlib import Path

          log = Path(sys.argv[1])
          if not log.exists():
              print("::notice::Tidak ada log yang tersimpan.")
              raise SystemExit(0)
          lines = log.read_text(errors="replace").splitlines()
          print(f"log: {len(lines)} baris")
          tail = "\n".join(lines[-150:])
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=Ekor log build::{escaped}")
          PY

      - name: Upload the whole log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kb-debug-build-log-${{ github.run_number }}
          path: ${{ env.BUILD_DIR }}/kb-debug-build.log
          if-no-files-found: warn
          retention-days: 7
