name: Deploy Neon Backend

on:
  workflow_dispatch:

concurrency:
  group: karsa-business-backend-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate deployment inputs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          for name in DATABASE_URL NEON_API_KEY NEON_PROJECT_ID FIREBASE_PROJECT_ID; do
            test -n "${!name:-}" || { echo "::error::$name is required"; exit 1; }
          done

      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund

      - name: Inject public Firebase project ID
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const id = process.env.FIREBASE_PROJECT_ID;
          if (!id || !/^[a-z][a-z0-9-]{4,28}[a-z0-9]$/.test(id)) throw new Error('FIREBASE_PROJECT_ID missing or invalid');
          fs.writeFileSync('functions/config.ts', `export const firebaseProjectId: string = ${JSON.stringify(id)};\n`);
          JS

      - name: Type check
        run: npm run check

      - name: Apply database migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate

      - name: Link and deploy Neon Function
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          NEON_BRANCH: ${{ vars.NEON_BRANCH }}
        run: |
          set -euo pipefail
          test -n "$NEON_API_KEY" && test -n "$NEON_PROJECT_ID"
          if [ -n "$NEON_BRANCH" ]; then
            npx neon link --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH"
          else
            npx neon link -y --project-id "$NEON_PROJECT_ID"
          fi
          # Link has been resolved explicitly; deploy the linked branch.
          npx neon deploy
