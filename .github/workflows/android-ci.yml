name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Report configuration status
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          KARSA_API_BASE_URL: ${{ secrets.KARSA_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_API_KEY:-}" ] || [ -z "${KARSA_API_BASE_URL:-}" ]; then
            echo "::warning title=Konfigurasi build tidak lengkap::Secret FIREBASE_API_KEY / KARSA_API_BASE_URL tidak tersedia pada job ini. Ini normal untuk pull request dari fork, yang memang tidak punya akses ke repository secrets. Build memakai nilai placeholder CI_PLACEHOLDER_*, jadi APK debug dari artifact tidak boleh dibagikan ke pengguna."
          else
            echo "Konfigurasi build debug lengkap."
          fi

      - name: Unit test and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_CLIENT_ID: ${{ secrets.FIREBASE_WEB_CLIENT_ID }}
          KARSA_API_BASE_URL: ${{ secrets.KARSA_API_BASE_URL }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: karsa-business-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
